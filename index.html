<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サイゼ注文番号 ノーヒント</title>
<style>
:root{--g:#1a7a3c;--r:#d6232a;--cream:#fff8e7;--ink:#2b2b2b}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Meiryo",sans-serif;background:repeating-conic-gradient(#fff 0 25%,#f3e6e6 0 50%) 0 0/48px 48px;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:16px}
h1{background:var(--g);color:#fff;margin:0 0 12px;padding:12px;border-radius:12px;text-align:center;font-size:1.3rem;border-bottom:4px solid var(--r)}
.card{background:var(--cream);border:3px solid var(--g);border-radius:14px;padding:16px;margin-bottom:12px}
.hide{display:none}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--r);color:#fff;font-weight:700;font-size:1.05rem}
button.sub{background:var(--g)}
button:active{transform:translateY(2px)}
.stat{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px}
.slip{background:#fff;border:2px dashed #999;padding:12px;border-radius:6px;font-size:1.2rem;text-align:center}
.slip b{font-size:1.5rem;color:var(--r)}
.slip small{display:block;color:#777;margin-top:4px}
.bar{height:10px;background:#ddd;border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--g);width:100%}
input{width:100%;font-size:2rem;text-align:center;letter-spacing:.3em;padding:10px;border:3px solid var(--g);border-radius:10px;margin:10px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--g);font-size:1.4rem;padding:14px}
.pad .del{background:#777}.pad .ok{background:var(--r)}
.fb{min-height:3.2em;text-align:center;font-weight:700;margin-top:10px}
.ok-t{color:var(--g)}.ng-t{color:var(--r)}
.plate{font-size:4rem;text-align:center;transition:transform .3s}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{font-size:.8rem;color:#666;text-align:center}
.mem{font-size:.9rem;line-height:1.6}
h1{position:relative}
#mute{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);padding:6px 10px;font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>🍅 サイゼ注文番号 ノーヒント 🍅<button id="mute" aria-label="音のオン・オフ">🔊</button></h1>

<section id="title" class="card">
  <p>サイゼリヤの注文用紙に書く<b>メニュー番号</b>を、<b>ヒント一切なし</b>で入力せよ。</p>
  <p>覚えているか、勘か、運か。間違えると<b>全然違う料理</b>が届くぞ。</p>
  <p class="mem" id="best"></p>
  <button id="start">注文を始める</button>
</section>

<section id="game" class="card hide">
  <div class="stat"><span id="round"></span><span id="score"></span><span id="lives"></span></div>
  <div class="slip" id="slip"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="plate" id="plate">📝</div>
  <input id="inp" inputmode="numeric" maxlength="4" readonly placeholder="????">
  <div class="pad" id="pad"></div>
  <div class="fb" id="fb"></div>
</section>

<section id="result" class="card hide">
  <h2 id="rank" style="margin-top:0"></h2>
  <p id="sum"></p>
  <button id="again">もう一度注文する</button>
</section>

<p class="note">※ 番号はゲーム内の目安です。実店舗のメニュー番号と異なる場合があります。非公式ファンゲーム。</p>
</main>
<script>
const MENU=[
 {n:"ミラノ風ドリア",c:"1201",e:"🍚"},
 {n:"辛味チキン",c:"1304",e:"🍗"},
 {n:"小エビのサラダ",c:"1101",e:"🥗"},
 {n:"ペペロンチーノ",c:"1405",e:"🍝"},
 {n:"ミートソース",c:"1402",e:"🍝"},
 {n:"マルゲリータピザ",c:"1501",e:"🍕"},
 {n:"柔らか青豆の温サラダ",c:"1103",e:"🫛"},
 {n:"ティラミス",c:"1601",e:"🍰"},
 {n:"プリン",c:"1604",e:"🍮"},
 {n:"ドリンクバー",c:"1801",e:"🥤"},
 {n:"エスカルゴのオーブン焼き",c:"1302",e:"🐌"},
 {n:"ハンバーグステーキ",c:"1701",e:"🥩"},
 {n:"ポップコーンシュリンプ",c:"1306",e:"🍤"},
 {n:"白ワイン(デカンタ)",c:"1901",e:"🍷"},
 {n:"ガーリックトースト",c:"1308",e:"🍞"}
];
const $=id=>document.getElementById(id);

// ---- 音（Web Audio で全部合成。音声ファイルなし） ----
const Snd=(()=>{
  let ctx,master,muted=false,bgmOn=false,step=0,nextT=0,tempo=1,loop;
  try{muted=localStorage.getItem("saize-mute")==="1"}catch(e){}
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      ctx=new AC();master=ctx.createGain();master.connect(ctx.destination);
      master.gain.value=muted?0:.5;
    }
    if(ctx.state==="suspended")ctx.resume();
    return true;
  }
  function tone(f,t,d,{type="square",vol=.2,to=null}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);
  }
  function noise(t,d,vol=.15){
    const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*d),ctx.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(),g=ctx.createGain();
    s.buffer=b;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(g).connect(master);s.start(t);
  }
  // 6/8 のタランテラ風（イ短調）。0 は休符
  const MEL=[69,76,76,76,74,72, 71,72,74,72,71,69, 68,71,76,76,74,71, 69,72,71,69,64,64,
             72,76,79,79,77,76, 74,77,76,74,72,71, 72,69,71,72,71,68, 69,0,69,69,0,0];
  const BASS=[45,45,40,45,48,50,40,45];
  function sched(){
    const len=60/150/2/tempo;
    while(nextT<ctx.currentTime+.15){
      const i=step%MEL.length,m=MEL[i],b=BASS[(i/6|0)%8];
      if(m)tone(hz(m),nextT,len*.9,{vol:.07});
      if(i%3===0)tone(hz(b+(i%6?7:0)),nextT,len*1.8,{type:"triangle",vol:.18});
      if(i%6===0)tone(150,nextT,.1,{type:"sine",vol:.25,to:50});
      if(i%6===3)noise(nextT,.05,.06);
      nextT+=len;step++;
    }
  }
  const S={
    get muted(){return muted},
    toggle(){
      muted=!muted;
      try{localStorage.setItem("saize-mute",muted?"1":"0")}catch(e){}
      if(init())master.gain.setTargetAtTime(muted?0:.5,ctx.currentTime,.02);
      return muted;
    },
    bgm(on){
      if(!init())return;
      clearInterval(loop);bgmOn=on;
      if(on){step=0;tempo=1;nextT=ctx.currentTime+.05;loop=setInterval(sched,40);sched()}
    },
    tempo(x){tempo=x},
    key(){if(init())tone(1200,ctx.currentTime,.05,{vol:.1})},
    // 呼び出しベル「ピンポーン」
    bell(){if(!init())return;const t=ctx.currentTime;
      tone(1318,t,.35,{type:"sine",vol:.3});tone(1046,t+.25,.7,{type:"sine",vol:.3})},
    ok(){if(!init())return;const t=ctx.currentTime+.5;
      [72,76,79,84].forEach((m,i)=>tone(hz(m),t+i*.08,.25,{type:"triangle",vol:.25}))},
    ng(){if(!init())return;const t=ctx.currentTime+.5;
      tone(180,t,.22,{type:"sawtooth",vol:.2});tone(140,t+.28,.4,{type:"sawtooth",vol:.2})},
    // 存在しない番号：店員さん困惑のびよよーん
    huh(){if(!init())return;const t=ctx.currentTime+.5;
      const o=ctx.createOscillator(),l=ctx.createOscillator(),lg=ctx.createGain(),g=ctx.createGain();
      o.frequency.setValueAtTime(500,t);o.frequency.linearRampToValueAtTime(200,t+.8);
      l.frequency.value=12;lg.gain.value=40;l.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(.2,t);g.gain.linearRampToValueAtTime(0,t+.8);
      o.connect(g).connect(master);o.start(t);l.start(t);o.stop(t+.85);l.stop(t+.85)},
    timeout(){if(!init())return;const t=ctx.currentTime;
      tone(hz(64),t,1.2,{type:"sine",vol:.3});tone(hz(76),t,1.2,{type:"sine",vol:.1})},
    tick(){if(init())tone(2000,ctx.currentTime,.03,{type:"square",vol:.08})},
    fanfare(){if(!init())return;const t=ctx.currentTime;
      [[72,0],[72,.12],[72,.24],[76,.36],[79,.6],[84,.84]].forEach(([m,d],i)=>
        tone(hz(m),t+d,i===5?1:.2,{vol:.15}))},
    // しょんぼりトロンボーン
    sad(){if(!init())return;const t=ctx.currentTime;
      [63,62,61].forEach((m,i)=>tone(hz(m),t+i*.45,.4,{type:"sawtooth",vol:.15}));
      const o=ctx.createOscillator(),l=ctx.createOscillator(),lg=ctx.createGain(),g=ctx.createGain();
      o.type="sawtooth";o.frequency.value=hz(60);l.frequency.value=6;lg.gain.value=6;
      l.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(.15,t+1.35);g.gain.linearRampToValueAtTime(0,t+2.6);
      o.connect(g).connect(master);o.start(t+1.35);l.start(t+1.35);o.stop(t+2.6);l.stop(t+2.6)}
  };
  return S;
})();
$("mute").textContent=Snd.muted?"🔇":"🔊";
$("mute").onclick=e=>{$("mute").textContent=Snd.toggle()?"🔇":"🔊";e.currentTarget.blur()};
const TIME=15000,ROUNDS=10;
let s,timer,cur,t0,locked;

function show(id){["title","game","result"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function best(){try{return +localStorage.getItem("saize-best")||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem("saize-best",v)}catch(e){}}
$("best").textContent=best()?`ハイスコア: ${best()}点`:"";

[1,2,3,4,5,6,7,8,9,"消",0,"注文"].forEach(k=>{
  const b=document.createElement("button");
  b.textContent=k;
  if(k==="消")b.className="del";
  if(k==="注文")b.className="ok";
  b.onclick=()=>press(k);
  $("pad").appendChild(b);
});
function press(k){
  if(locked)return;
  const i=$("inp");
  if(k==="消"){i.value=i.value.slice(0,-1);Snd.key()}
  else if(k==="注文")submit();
  else if(i.value.length<4){i.value+=k;Snd.key()}
}
document.addEventListener("keydown",e=>{
  if($("game").classList.contains("hide"))return;
  if(/^\d$/.test(e.key))press(+e.key);
  else if(e.key==="Backspace")press("消");
  else if(e.key==="Enter")press("注文");
});

function start(){
  s={r:0,score:0,lives:3,ok:0,log:[]};
  show("game");Snd.bgm(true);next();
}
function next(){
  if(s.r>=ROUNDS||s.lives<=0)return end();
  s.r++;locked=false;
  cur=MENU[Math.random()*MENU.length|0];
  const q=1+(Math.random()*3|0);
  cur.q=q;
  $("slip").innerHTML=`<b>${cur.n}</b> × ${q}<small>注文番号を入力してください</small>`;
  $("inp").value="";$("fb").textContent="";$("plate").textContent="📝";
  hud();
  t0=Date.now();
  let lastSec=99;
  clearInterval(timer);
  timer=setInterval(()=>{
    const left=TIME-(Date.now()-t0);
    $("bar").style.width=Math.max(0,left/TIME*100)+"%";
    // 残り時間が減るほどBGMが速くなる
    Snd.tempo(1+Math.max(0,1-left/TIME)*.8);
    const sec=Math.ceil(left/1000);
    if(sec<=3&&sec>0&&sec<lastSec)Snd.tick();
    lastSec=sec;
    if(left<=0){clearInterval(timer);judge(null)}
  },50);
}
function hud(){
  $("round").textContent=`${s.r}/${ROUNDS}品目`;
  $("score").textContent=`${s.score}点`;
  $("lives").textContent="❤".repeat(s.lives)+"🖤".repeat(3-s.lives);
}
function submit(){
  const v=$("inp").value;
  if(!v)return;
  clearInterval(timer);Snd.bell();judge(v);
}
function judge(v){
  locked=true;
  Snd.tempo(1);
  const fb=$("fb");
  if(v===cur.c){
    Snd.ok();
    const bonus=Math.max(0,Math.round((TIME-(Date.now()-t0))/100));
    s.score+=100+bonus;s.ok++;
    $("plate").textContent=cur.e;
    fb.className="fb ok-t";
    fb.textContent=`正解！ ${cur.n}が${cur.q}つ届きました（+${100+bonus}）`;
  }else{
    s.lives--;
    let got;
    if(v===null)got={n:"何も",e:"⌛"};
    else got=MENU.find(m=>m.c===v);
    if(v===null)Snd.timeout();else if(got)Snd.ng();else Snd.huh();
    $("plate").textContent=got?got.e:"❓";
    fb.className="fb ng-t shake";
    if(v===null)fb.textContent=`時間切れ…店員さんが来ません。正解は ${cur.c}`;
    else if(got)fb.textContent=`${v}は「${got.n}」でした！ 正解は ${cur.c}`;
    else fb.textContent=`${v}は存在しない番号…店員さんが困惑。正解は ${cur.c}`;
  }
  s.log.push(cur.n);
  hud();
  setTimeout(next,1800);
}
function end(){
  show("result");
  Snd.bgm(false);
  if(s.ok>=7)Snd.fanfare();else Snd.sad();
  const sc=s.score;
  const rank=s.ok>=ROUNDS?"サイゼ番号マスター 🏆":s.ok>=7?"常連のお客様 🍷":s.ok>=4?"ドリンクバー民 🥤":s.ok>=1?"初来店の学生 🎒":"ただの迷子 🍅";
  $("rank").textContent=rank;
  const nb=sc>best();
  if(nb)setBest(sc);
  $("sum").innerHTML=`正解 ${s.ok}/${s.r}　スコア <b>${sc}</b>点${nb?" 🎉ハイスコア更新！":""}`;
  $("best").textContent=`ハイスコア: ${best()}点`;
}
$("start").onclick=start;
$("again").onclick=start;
</script>
</body>
</html>
